---
- name: install software
  win_chocolatey:
    bootstrap_tls_version: ["tls13"]
    name: "{{ software_to_install }}"
    # state: latest
    # force: true
  register: install_software
  until: install_software.rc == 0
  delay: '{{ global_delay }}'
  notify: reboot windows

- name: enable linux metadata support for wsl and restart it
  win_shell: |
    wsl -d Ubuntu -- sh -c "mkdir -p /etc && cat >/etc/wsl.conf <<'EOF'
    [automount]
    options = metadata
    EOF"
  notify: reboot windows

- name: configure firefox
  block:

  - name: ensure distribution folder exists
    win_file:
      path: C:\Program Files\Mozilla Firefox\distribution
      state: directory

  - name: deploy policies.json
    win_copy:
      src: policies.json
      dest: "C:\\Program Files\\Mozilla Firefox\\distribution\\policies.json"
      force: yes

- name: install vscode extensions
  win_command: >
    "C:\Program Files\Microsoft VS Code\bin\code.cmd" --install-extension {{ item }} --force
  loop: "{{ vcsode_extensions_to_install }}"

- name: reboot
  meta: flush_handlers